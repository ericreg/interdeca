[project]
name = "interdeca"
version = "0.1.0"
description = "UI-independent geometry, texture, and population analysis for InterDeCA"
readme = "README.md"
authors = [
    { name = "Eric Regina", email = "eregina92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.2,<9",
    "interdeca-client==0.1.0",
    "websockets>=15,<16",
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "pydantic>=2.11,<3",
    "scipy>=1.15,<2",
    "scikit-image>=0.25,<1",
    "scikit-learn>=1.6,<2",
    "umap-learn>=0.5.7,<0.6",
    "vtk>=9.4,<10",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship the unmodified Atlas Builder and its notices in both wheels and sdists.
# The remaining Slicer extension assets are available in the submodule checkout.
source-exclude = [
    "/src/interdeca/_vendor/morphoweave/.git",
    "/src/interdeca/_vendor/morphoweave/.gitignore",
    "/src/interdeca/_vendor/morphoweave/Docs",
    "/src/interdeca/_vendor/morphoweave/ExtensionsIndex",
    "/src/interdeca/_vendor/morphoweave/tutorial",
    "/src/interdeca/_vendor/morphoweave/logo.png",
    "/src/interdeca/_vendor/morphoweave/MorphoWeaveLandmarkTransfer",
    "/src/interdeca/_vendor/morphoweave/MorphoWeaveModelLibrary",
    "/src/interdeca/_vendor/morphoweave/MorphoWeaveSurfaceSegmentation",
    "/src/interdeca/_vendor/morphoweave/MorphoWeaveAtlasBuilder/Resources",
    "/src/interdeca/_vendor/morphoweave/MorphoWeaveAtlasBuilder/Testing",
]

[tool.uv.workspace]
members = ["client"]

[tool.uv.sources]
interdeca-client = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
profiling = [
    "matplotlib>=3.10,<4",
    "memray>=1.19,<2 ; sys_platform != 'win32'",
    "psutil>=7,<8",
    "yappi>=1.7,<2",
]

[project.scripts]
interdeca = "interdeca.cli:main"
interdeca-worker = "interdeca.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["end_to_end: launches Slicer, the uv worker, and Blender"]
