[project]
name = "interdeca"
version = "0.1.0"
description = "UI-independent geometry, texture, and population analysis for InterDeCA"
readme = "README.md"
authors = [
    { name = "Eric Regina", email = "eregina92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "pydantic>=2.11,<3",
    "scipy>=1.15,<2",
    "scikit-image>=0.25,<1",
    "scikit-learn>=1.6,<2",
    "vtk>=9.4,<10",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5.7,<0.6"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
