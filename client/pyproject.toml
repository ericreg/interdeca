[project]
name = "interdeca-client"
version = "0.1.0"
description = "Thin presentation client for the InterDeCA application worker"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "websockets>=15,<16",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
