name: Research integration checks

on:
  push:
    paths:
      - 'experiments/fishy/**'
      - 'tests/fishy/**'
      - 'tools/**'
      - 'docs/fishy/evidence/**'
      - '.github/workflows/research-checks.yml'
  pull_request:
    paths:
      - 'experiments/fishy/**'
      - 'tests/fishy/**'
      - 'tools/**'
      - 'docs/fishy/evidence/**'
      - '.github/workflows/research-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fish-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: |
            experiments/fishy/reference/paper_synth/requirements-paper.txt
            experiments/fishy/requirements-tooling.txt
      - name: Install the 29 scientific and 5 tooling pins
        run: >-
          python -m pip install
          -r experiments/fishy/reference/paper_synth/requirements-paper.txt
          -r experiments/fishy/requirements-tooling.txt
          ruff==0.16.10
      - name: Run authored CPU behavioral tests
        run: python -m unittest discover -s tests/fishy -p 'test_*.py' -v
      - name: Verify published research evidence
        run: python tools/verify_research_evidence.py docs/fishy/evidence/2026-10-13
      - name: Lint authored integration and tests
        run: |
          ruff check --select E4,E7,E9,F,I,UP,B,SIM experiments/fishy/*.py tests/fishy tools/verify_research_evidence.py
          ruff format --check experiments/fishy/*.py tests/fishy tools/verify_research_evidence.py
      - name: Compile authored integration and tests
        run: python -m compileall -q experiments/fishy/*.py tests/fishy tools/verify_research_evidence.py
