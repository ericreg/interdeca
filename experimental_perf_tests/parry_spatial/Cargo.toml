[package]
name = "interdeca-parry-spatial"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "interdeca_parry_spatial"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
parry3d-f64 = "=0.31.1"
rayon = "1.11"

[profile.release]
lto = "thin"
codegen-units = 1

